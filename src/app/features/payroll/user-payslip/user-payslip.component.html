<div class="main-container">
<div class="payslip-container">
  <h2 class="title">My Pay Slips</h2>

  <div class="year-selector">
    <button mat-icon-button (click)="previousYear()" >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <span class="year-text">{{ selectedYear }}</span>

    <button mat-icon-button (click)="nextYear()">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="payslipData" class="mat-elevation-z8">
      <ng-container matColumnDef="month">
        <th mat-header-cell *matHeaderCellDef>Month</th>
        <td mat-cell *matCellDef="let element" class="center-cell">
          {{ element.month }}
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Download</th>
        <td mat-cell *matCellDef="let element; let i = index">
          <button
            mat-raised-button
            color="primary"
            (click)="downloadPayslip(element.month)"
            [disabled]="isMonthDisabled(i)"
          >
            <mat-icon>download</mat-icon>
            Download
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
</div>
