<div class="payruns-container">
  <h2>Salary Status – {{ getMonthName() }}</h2>


  <div class="filters-bar">
    <input
      type="text"
      placeholder="Search by ID or Name..."
      [(ngModel)]="searchText"
      (input)="onSearch()"
    />
    <input
      type="month"
      [(ngModel)]="selectedMonth"
      (change)="onMonthChange()"
    />
  </div>


  <div class="table-responsive">

    <table class="salary-table">
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Account No.</th>
          <th>Status</th>
          <th>Action</th>


        </tr>
      </thead>
      <tbody>

        <tr *ngFor="let emp of filteredData">
          <td>{{ emp.employeeId }}</td>
          <td>
            <div>
              <span>{{ emp.employeeName }}</span>
            </div>
          </td>
          <td>{{ emp.accountNumber }}</td>
          <td>{{ emp.status }}</td>
          <td class="action-buttons">
            <span> <button class="btn-slip" (click)="downloadSalarySlip(emp.employeeId, selectedMonth)">
                <i class="ri-download-line"></i>
              </button>
            </span>
            <span>
              <button *ngIf="hasSalary(emp.employeeId)" class="btn-slip"
                (click)="deleteSalary(getSalaryId(emp.employeeId))">
                <i class="ri-delete-bin-line"></i>
              </button>
            </span>
          </td>




        </tr>
      </tbody>
    </table>

    <div *ngIf="payruns.length === 0" class="no-data">No Salary Status</div>
  </div>
</div>
