<div class="payruns-container">
  <h2>Salary Status – {{ getMonthName() }}</h2>

  <!-- Filters -->
  <div class="filters-bar">
    <input type="text" placeholder="Search by ID or Name..." [(ngModel)]="searchText" (input)="onSearch()" />



    <input type="month" [(ngModel)]="selectedMonth" (change)="onMonthChange()" />
  </div>
  <!-- Salary Table -->
  <div class="table-responsive">
    
    <table class="salary-table" >
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Account No.</th>
          <th>Status</th>
          <th>Salary Slip</th>
        </tr>
      </thead>
      <tbody>
      
        <tr *ngFor="let emp of payruns">
          <td>{{ emp.employeeId }}</td>
          <td>
            <div>
              <span>{{ emp.employeeName}}</span>
            </div>
          </td>
          <td>{{ emp.accountNumber }}</td>
          <td>{{ emp.status }}</td>
          <td>
            <button class="btn-slip" (click)="viewOrGenerateSalary(emp)"><i class="ri-download-line"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="payruns.length === 0" class="no-data">No Salary Status</div>
  </div>
</div>
